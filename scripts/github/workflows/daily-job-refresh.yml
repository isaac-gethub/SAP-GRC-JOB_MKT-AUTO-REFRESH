name: Daily Job Market Refresh

on:
  schedule:
    # 11:00 UTC daily (~7am US Eastern, ~4:30pm India, ~3pm UAE).
    # Adjust to taste — GitHub's cron scheduler can run a few minutes late.
    - cron: "0 11 * * *"
  workflow_dispatch: {} # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run job market refresh
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit and push jobs.json if it changed
        run: |
          git config user.name "tib-job-market-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- jobs.json; then
            echo "No changes to jobs.json — nothing to commit."
          else
            git add jobs.json
            git commit -m "Daily job market refresh"
            git push
          fi
